name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest, archive: zip, exe: .exe }
          - { target: aarch64-apple-darwin, os: macos-latest, archive: tar.gz, exe: "" }
          - { target: x86_64-apple-darwin, os: macos-latest, archive: tar.gz, exe: "" }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, archive: tar.gz, exe: "" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p hub-app
      - name: Test macOS bundle packaging
        if: runner.os == 'macOS'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/test-macos-package.sh "target/${{ matrix.target }}/release/agent-hub" "${RELEASE_TAG#v}"
      - name: Package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          name=agent-hub-${{ matrix.target }}
          built=target/${{ matrix.target }}/release/agent-hub${{ matrix.exe }}
          mkdir -p dist stage
          cp "$built" "dist/${name}${{ matrix.exe }}"
          cp "$built" stage/
          cp README.md LICENSE stage/
          if [ "${{ matrix.archive }}" = zip ]; then
            (cd stage && 7z a "../dist/${name}.zip" .)
          else
            tar -czf "dist/${name}.tar.gz" -C stage .
          fi
          # Add the Finder application separately; raw binaries and archives are
          # still published under the names used by the existing self-updater.
          if [[ "${{ matrix.target }}" == *-apple-darwin ]]; then
            bash scripts/package-macos.sh "$built" "${RELEASE_TAG#v}" "stage-app/agent-hub.app"
            ditto -c -k --sequesterRsrc --keepParent "stage-app/agent-hub.app" "dist/${name}.app.zip"
          fi
          cd dist
          for file in *; do
            if command -v sha256sum >/dev/null; then sha256sum "$file"; else shasum -a 256 "$file"; fi > "${file}.sha256"
          done
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
