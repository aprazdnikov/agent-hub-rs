[package]
name = "hub-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "agent-hub"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
directories.workspace = true
eframe.workspace = true
futures.workspace = true
hub-claude.workspace = true
hub-codex.workspace = true
hub-qwen.workspace = true
hub-hermes.workspace = true
hub-opencode.workspace = true
hub-core.workspace = true
hub-telegram.workspace = true
keyring.workspace = true
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop", "creation-flags"] }
reqwest = { workspace = true, features = ["multipart"] }
rfd.workspace = true
self-replace.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util.workspace = true
toml.workspace = true
uuid = { workspace = true, features = ["v4"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.62", features = ["Win32_System_Threading"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
tray-icon = { workspace = true, features = ["ksni"] }

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd")))'.dependencies]
tray-icon.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[dev-dependencies]
log = "0.4"
rstest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
