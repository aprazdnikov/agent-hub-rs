# Throwaway offscreen render harness. NOT a workspace member: the empty
# [workspace] table below detaches it from the agent-hub-rs workspace so the
# app's Cargo.toml/Cargo.lock are never touched.
[package]
name = "render-harness"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
hub-app = { path = "../../crates/hub-app" }
hub-core = { path = "../../crates/hub-core" }
hub-telegram = { path = "../../crates/hub-telegram" }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts"] }
epaint = "=0.36.2"
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { version = "1", features = ["sync"] }
anyhow = "1"
uuid = "1"
jiff = "0.2"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"
# Narrowed for this throwaway rasterizer harness (recorded in render-report.md):
# pixel math converts f32<->u8<->usize by construction-bounded ranges; the cast
# family would otherwise flag every pixel write. No downstream API contract
# exists (bin-only crate), so must_use_candidate / missing_errors_doc /
# module_name_repetitions add noise without catching a defect class here.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# The top-left fill rule tests edge functions for EXACT zero to assign shared-edge
# pixels to one triangle; an epsilon would double-blend feathered seams. Exact
# float equality is the algorithm, not an approximate-comparison defect.
float_cmp = "allow"
# ctx.fonts() needs a closure general over the FontsView lifetime; the lint's
# suggested method-pointer replacement fails that HRTB bound ("implementation
# of FnOnce is not general enough"), so the closure must stay.
redundant_closure = "allow"
redundant_closure_for_method_calls = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
